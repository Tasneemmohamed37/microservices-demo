apiVersion: v1
kind: Service
metadata:
  name: platformnpservice-srv
spec:
  type: NodePort
  selector:
    app: platformservice
  ports:
    - name: platformservice
      protocol: TCP
      port: 80          # 1. INTERNAL PORT: For communication inside the cluster
      targetPort: 8080  # 2. MATCHING PORT: Maps directly to the Deployment's containerPort
      nodePort: 30001